name: Build Gershwin Packages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'gershwin/**'
      - '.github/workflows/gershwin-build.yml'
  pull_request:
    paths:
      - 'gershwin/**'
      - '.github/workflows/gershwin-build.yml'
  workflow_dispatch:

env:
  # Use a directory outside the workspace to avoid file system loops
  SDK_DIR: ${{ github.workspace }}/../openwrt-sdk

jobs:
  build:
    name: Build Gershwin (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-generic
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/x86/generic/openwrt-sdk-24.10.5-x86-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - target: bcm27xx-bcm2711
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libffi-dev libncurses-dev libssl-dev \
            libncurses5-dev libelf-dev python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget zstd cmake ninja-build

      - name: Download and extract SDK
        run: |
          # Create SDK directory outside workspace to avoid file system loops
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst --strip-components=1
          rm sdk.tar.zst

      - name: Configure feeds
        run: |
          cd "$SDK_DIR"
          # Clear the existing feeds.conf.default to avoid duplicates
          echo "" > feeds.conf.default
          
          # Add the video feed (our local checkout)
          echo "src-link video $GITHUB_WORKSPACE/video" >> feeds.conf.default
          # Add feeds from GitHub
          echo "src-git base https://github.com/openwrt/openwrt.git" >> feeds.conf.default
          echo "src-git packages https://github.com/openwrt/packages.git" >> feeds.conf.default 
          
          # Update and install feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p video llvm
        shell: /usr/bin/bash -e {0}

      - name: Build host LLVM/Clang
        run: |
          cd "$SDK_DIR"
          
          # Configure for building
          make defconfig
          
          # Build host LLVM/Clang first (required for cross-compilation)
          # Use the feeds path since llvm is installed from the video feed
          echo "=========================================="
          echo "Building host LLVM/Clang (this may take a while)..."
          echo "=========================================="
          make package/feeds/video/llvm/host/compile V=s -j$(nproc) || make package/feeds/video/llvm/host/compile V=s -j1

      - name: Build Gershwin packages
        run: |
          cd "$SDK_DIR"
          
          # Build all Gershwin packages (in dependency order)
          PACKAGES="
            gershwin-system
            gershwin-assets
            swift-corelibs-libdispatch
            gnustep-make
            libobjc2
            gnustep-base
            gnustep-gui
            gnustep-back
            gershwin-plistupdate
            gershwin-workspace
            gershwin-systempreferences
            gershwin-eau-theme
            gershwin-terminal
            gershwin-textedit
            gershwin-xcbkit
            gershwin-windowmanager
            gershwin-menu
            gershwin-loginwindow
            gershwin-appwrap
            gershwin-display
            gershwin-keyboard
            gershwin-globalshortcuts
            gershwin-screenshot
            gershwin-printers
            gershwin-network
            gershwin-sound
            gershwin-sharing
            gershwin-console
            gershwin-sudoaskpass
            gershwin-processes
          "
          
          for pkg in $PACKAGES; do
            echo "=========================================="
            echo "Building package: $pkg"
            echo "=========================================="
            # Use feeds path since packages are installed from the video feed
            make package/feeds/video/$pkg/compile V=s || echo "Warning: $pkg failed to build"
          done

      - name: List built packages
        run: |
          echo "=== Built packages ==="
          find "$SDK_DIR/bin" -name "*.ipk" -type f | head -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gershwin-packages-${{ matrix.target }}
          path: ${{ github.workspace }}/../openwrt-sdk/bin/packages/
          retention-days: 7
