name: Build X11 Packages

on:
  push:
    branches:
      - master
      - 'copilot/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build X11 packages (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-generic
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/x86/generic/openwrt-sdk-24.10.5-x86-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_name: openwrt-sdk-24.10.5-x86-generic_gcc-13.3.0_musl.Linux-x86_64
          - target: bcm27xx-bcm2711
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_name: openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64

    steps:
      - name: Checkout video feed
        uses: actions/checkout@v4
        with:
          path: video

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-setuptools \
            rsync unzip wget xsltproc zlib1g-dev zstd

      - name: Download and extract OpenWrt SDK
        run: |
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar.zst
          zstd -d sdk.tar.zst -o sdk.tar
          tar -xf sdk.tar
          mv "${{ matrix.sdk_name }}" sdk

      - name: Configure feeds
        run: |
          cd sdk
          # Clear the existing feeds.conf.default to avoid duplicates
          echo "" > feeds.conf.default
          
          # Add the video feed (our local checkout)
          echo "src-link video $GITHUB_WORKSPACE/video" >> feeds.conf.default
          # Add feeds from GitHub
          echo "src-git base https://github.com/openwrt/openwrt.git" >> feeds.conf.default
          echo "src-git packages https://github.com/openwrt/packages.git" >> feeds.conf.default 
          
          # Update and install feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p video
        shell: /usr/bin/bash -e {0}


      - name: Build X11 core libraries
        run: |
          set +e  # Don't exit on error for defconfig
          cd sdk
          # Enable packages for build
          # Protocol and build infrastructure
          # Note: defconfig may warn about missing menu items but this is OK
          make defconfig
          set -e  # Re-enable exit on error
          
          # Build core X11 protocol packages first
          echo "Building xorgproto..."
          make package/xorgproto/compile V=s
          
          echo "Building xorg-macros..."
          make package/xorg-macros/compile V=s
          
          echo "Building libxtrans..."
          make package/libxtrans/compile V=s
          
          echo "Building xcb-proto..."
          make package/xcb-proto/compile V=s

      - name: Build X11 authentication libraries
        run: |
          cd sdk
          echo "Building libxau..."
          make package/libxau/compile V=s
          
          echo "Building libxdmcp..."
          make package/libxdmcp/compile V=s

      - name: Build XCB and X11 libraries
        run: |
          cd sdk
          echo "Building libxcb..."
          make package/libxcb/compile V=s
          
          echo "Building libx11..."
          make package/libx11/compile V=s

      - name: Build X11 extension libraries
        run: |
          cd sdk
          echo "Building libxext..."
          make package/libxext/compile V=s
          
          echo "Building libxfixes..."
          make package/libxfixes/compile V=s
          
          echo "Building libxrender..."
          make package/libxrender/compile V=s
          
          echo "Building libxrandr..."
          make package/libxrandr/compile V=s
          
          echo "Building libxi..."
          make package/libxi/compile V=s
          
          echo "Building libxinerama..."
          make package/libxinerama/compile V=s
          
          echo "Building libxshmfence..."
          make package/libxshmfence/compile V=s

      - name: Build X11 session libraries
        run: |
          cd sdk
          echo "Building libice..."
          make package/libice/compile V=s
          
          echo "Building libsm..."
          make package/libsm/compile V=s

      - name: Build X11 toolkit libraries
        run: |
          cd sdk
          echo "Building libxt..."
          make package/libxt/compile V=s
          
          echo "Building libxmu..."
          make package/libxmu/compile V=s
          
          echo "Building libxpm..."
          make package/libxpm/compile V=s
          
          echo "Building libxaw..."
          make package/libxaw/compile V=s

      - name: Build X11 font and misc libraries
        run: |
          cd sdk
          echo "Building libxfont2..."
          make package/libxfont2/compile V=s
          
          echo "Building libxkbfile..."
          make package/libxkbfile/compile V=s
          
          echo "Building libxft..."
          make package/libxft/compile V=s
          
          echo "Building libpciaccess..."
          make package/libpciaccess/compile V=s
          
          echo "Building libxcvt..."
          make package/libxcvt/compile V=s

      - name: Build XLibre X server
        run: |
          cd sdk
          echo "Building xlibre..."
          make package/xlibre/compile V=s

      - name: Build X11 input drivers
        run: |
          cd sdk
          echo "Building xf86-input-evdev..."
          make package/xf86-input-evdev/compile V=s
          
          echo "Building xf86-input-libinput..."
          make package/xf86-input-libinput/compile V=s

      - name: Build X11 video drivers
        run: |
          cd sdk
          echo "Building xf86-video-fbdev..."
          make package/xf86-video-fbdev/compile V=s
          
          echo "Building xf86-video-vesa..."
          make package/xf86-video-vesa/compile V=s

      - name: Build X11 utilities
        run: |
          cd sdk
          echo "Building xkbcomp..."
          make package/xkbcomp/compile V=s
          
          echo "Building xauth..."
          make package/xauth/compile V=s
          
          echo "Building xinit..."
          make package/xinit/compile V=s
          
          echo "Building xrandr..."
          make package/xrandr/compile V=s
          
          # echo "Building xterm..."
          # make package/xterm/compile V=s

      - name: Collect build results
        run: |
          cd sdk
          echo "=== Build Results ==="
          echo "Listing built packages:"
          find bin/packages -name "*.ipk" -type f 2>/dev/null | sort || echo "No packages built"
          echo ""
          echo "=== Package count ==="
          find bin/packages -name "*.ipk" -type f 2>/dev/null | wc -l || echo "0"

      - name: Generate package feed index
        run: |
          cd sdk
          # Generate Packages index for each architecture/feed
          for arch_dir in bin/packages/*; do
            if [ -d "$arch_dir" ]; then
              echo "Generating package index for $(basename $arch_dir)..."
              for feed_dir in "$arch_dir"/*; do
                if [ -d "$feed_dir" ]; then
                  echo "  Processing feed: $(basename $feed_dir)"
                  ./staging_dir/host/bin/usign -G -s "$feed_dir/key-build" -p "$feed_dir/key-build.pub" -c "Local build key" 2>/dev/null || true
                  ./scripts/ipkg-make-index.sh "$feed_dir" > "$feed_dir/Packages"
                  gzip -9c "$feed_dir/Packages" > "$feed_dir/Packages.gz"
                  # Sign the package index if possible
                  if [ -f "$feed_dir/key-build" ]; then
                    ./staging_dir/host/bin/usign -S -m "$feed_dir/Packages" -s "$feed_dir/key-build" 2>/dev/null || true
                  fi
                  echo "  Generated Packages index with $(grep -c '^Package:' "$feed_dir/Packages" 2>/dev/null || echo 0) packages"
                fi
              done
            fi
          done

      - name: Create distribution archive
        run: |
          cd sdk
          mkdir -p dist
          
          # Copy installer script to dist
          cp "$GITHUB_WORKSPACE/video/install-x11-packages.sh" dist/
          chmod +x dist/install-x11-packages.sh
          
          # Copy packages with feed structure
          cp -r bin/packages dist/
          
          # Create README for the distribution
          cat > dist/README.txt << 'EOF'
          OpenWrt Video Feed - X11 Packages Distribution
          ===============================================
          
          This archive contains pre-built X11 packages for OpenWrt including the
          XLibre X server and related drivers and utilities.
          
          Installation:
          ------------
          1. Extract this archive to your OpenWrt device
          2. Run the installer script as root:
             chmod +x install-x11-packages.sh
             ./install-x11-packages.sh
          
          Manual Installation:
          -------------------
          If you prefer to install packages manually, you can use opkg:
          
          1. Add the local feed to /etc/opkg/customfeeds.conf:
             echo "src/gz video_local file:///path/to/packages/<arch>/video" >> /etc/opkg/customfeeds.conf
          
          2. Update package lists:
             opkg update
          
          3. Install desired packages:
             opkg install xlibre xf86-video-fbdev xinit
          
          Package Structure:
          -----------------
          packages/
            └── <architecture>/
                └── video/
                    ├── Packages       (Package index)
                    ├── Packages.gz    (Compressed index)
                    └── *.ipk          (Package files)
          
          For more information, visit:
          https://github.com/probonopd/openwrt-video-feed
          EOF
          
          # Create the zip archive
          cd dist
          zip -r "../x11-packages-${{ matrix.target }}.zip" .
          cd ..
          
          echo "=== Distribution Archive ==="
          ls -lh "x11-packages-${{ matrix.target }}.zip"
          echo ""
          echo "=== Archive Contents ==="
          unzip -l "x11-packages-${{ matrix.target }}.zip" | head -30

      - name: Upload distribution archive
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x11-packages-${{ matrix.target }}-distribution
          path: sdk/x11-packages-${{ matrix.target }}.zip
          if-no-files-found: warn

      - name: Upload built packages (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x11-packages-${{ matrix.target }}-raw
          path: sdk/bin/packages/
          if-no-files-found: warn
